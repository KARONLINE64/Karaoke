<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Floribar Karaoke</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<img src="logo.png" id="logo" alt="Floribar Karaoke">

<input
type="text"
id="search"
placeholder="Search artist or song..."
autocomplete="off">

</header>

<main>

<section id="homePage">

<div id="welcome">

<div class="welcomeAction">

<span class="icon">🎤</span>

<span>Pick your song and let's sing!</span>

</div>

<div class="welcomeAction">

<span class="icon">📚</span>

<span>Or view our entire catalog</span>

</div>

</div>

</section>

<section id="catalogPage" class="hidden">

<div class="catalogItem" data-file="english.json">📚 English</div>

<div class="catalogItem" data-file="francais.json">📚 Français</div>

<div class="catalogItem" data-file="nederlands.json">📚 Nederlands</div>

<div class="catalogItem" data-file="italiano.json">📚 Italiano</div>

<div class="catalogItem" data-file="espanol.json">📚 Español</div>

</section>

<section id="songsPage" class="hidden">

<div id="songs"></div>

</section>

</main>

<nav class="bottomNav">

<button id="homeBtn">
🏠 Home
</button>

<button id="catalogBtn">
📚 Catalog
</button>

<button id="favBtn">
⭐ My Songs
</button>

</nav>

<script src="script.js"></script>

</body>

</html>
