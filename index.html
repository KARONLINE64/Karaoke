<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Karaoke</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="offlineOverlay">
  <span data-i18n="requestsDisabled">Demandes désactivées actuellement. Attendez le début de l'animation svp.</span>
</div>

<header>

<img src="logo.png" id="logo" alt="Karaoke">

<div class="lang-switch" aria-label="Choix de langue">
  <button class="lang-btn active" data-locale="fr" type="button">FR</button>
  <button class="lang-btn" data-locale="en" type="button">EN</button>
</div>

<input
id="search"
type="text"
placeholder="Rechercher un artiste ou une chanson..."
data-i18n-placeholder="searchPlaceholder"
autocomplete="off"
spellcheck="false">

</header>

<main>

<section id="homePage">

<div id="welcome">

<div class="welcomeAction">
<span class="icon">🎤</span>
<span data-i18n="welcome1">Choisissez une chanson, envoyez votre demande et chantons !</span>
</div>

<div class="welcomeAction">
<span class="icon">📚</span>
<span data-i18n="welcome2">Ou parcourez notre catalogue complet</span>
</div>

</div>

</section>

<section id="catalogPage" class="hidden">

<div class="catalogItem" data-file="english.json">
English
</div>

<div class="catalogItem" data-file="francais.json">
Français
</div>

<div class="catalogItem" data-file="nederlands.json">
Nederlands
</div>

<div class="catalogItem" data-file="italiano.json">
Italiano
</div>

<div class="catalogItem" data-file="español.json">
Español
</div>

</section>

<section id="songsPage" class="hidden">

<div id="songs"></div>

</section>

</main>

<nav class="bottomNav">

<button id="homeBtn" type="button">
<span class="nav-icon">🏠</span>
<span data-i18n="navHome" style="font-size:0.82em;">Accueil</span>
</button>

<button id="catalogBtn" type="button">
<span class="nav-icon">📚</span>
<span data-i18n="navCatalog" style="font-size:0.82em;">Catalogue</span>
</button>

<button id="requestBtn" type="button">
<span class="nav-icon">✉️</span>
<span data-i18n="navRequest" style="font-size:0.82em;">Demande</span>
</button>

<button id="favBtn" type="button">
<span class="nav-icon">⭐</span>
<span data-i18n="navFavorites" style="font-size:0.82em;">Mes chansons</span>
</button>

</nav>


<!-- Request modal (hidden by default) -->
<div id="requestModal" class="hidden">
	<div class="rb-overlay"></div>
	<div class="rb-box">
		<h3 data-i18n="requestModalTitle">Demande</h3>

<label for="reqSongSearch" data-i18n="requestSong">Chanson</label>
	<input id="reqSongSearch" type="text" data-i18n-placeholder="requestSongPlaceholder" placeholder="Rechercher artiste ou titre">
	<div id="requestResults" class="requestResults"></div>

		<label for="reqArtist" data-i18n="requestArtist">Artiste</label>
		<input id="reqArtist" type="text" readonly>

		<label for="reqTitle" data-i18n="requestTitle">Titre</label>
		<input id="reqTitle" type="text" readonly>

		<label for="reqSinger" data-i18n="requestSinger">Chanteur</label>
		<input id="reqSinger" type="text" data-i18n-placeholder="requestSingerPlaceholder" placeholder="Nom du chanteur">

		<label for="reqKey" data-i18n="requestKey">Transposition</label>
		<select id="reqKey"></select>

		<div class="rb-actions">
			<button id="sendRequestBtn" type="button" data-i18n="sendRequest">ENVOYER LA DEMANDE</button>
			<button id="cancelRequestBtn" type="button" data-i18n="cancelRequest">ANNULER</button>
		</div>

		<div id="requestStatus" aria-live="polite"></div>
	</div>
</div>

<script>localStorage.setItem('karaokeLocale', 'fr');</script>
<script src="script.js"></script>
<script>if (typeof applyLocale === 'function') applyLocale('fr');</script>
</body>
</html>
