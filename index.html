<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke — Under Construction</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle at top,#133a7a 0%,#0b1730 18%,#050505 55%,#000 100%);
color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center;overflow:hidden
}
.container{width:min(90vw,800px);padding:40px 25px}
h1{
margin:0 0 20px;font-size:clamp(42px,9vw,82px);font-weight:700;
letter-spacing:4px;
text-shadow:0 0 5px rgba(255,255,255,.9),0 0 15px rgba(255,255,255,.7),0 0 35px rgba(255,255,255,.45)
}
.line{
width:120px;height:2px;margin:0 auto 28px;background:#fff;
box-shadow:0 0 8px rgba(255,255,255,.9),0 0 20px rgba(255,255,255,.6)
}
p{
margin:0;font-size:clamp(18px,3.5vw,28px);letter-spacing:1px;line-height:1.5;
text-shadow:0 0 6px rgba(255,255,255,.7),0 0 18px rgba(255,255,255,.35)
}
.sub{margin-top:14px;font-size:clamp(14px,2.5vw,19px);opacity:.8;letter-spacing:2px}
</style>
</head>
<body>
<main class="container">
<h1>UNDER CONSTRUCTION</h1>
<div class="line"></div>
<p>Our karaoke songbook is currently being updated.</p>
<p class="sub">BACK SOON</p>
</main>
</body>
</html>
