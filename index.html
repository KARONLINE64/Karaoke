<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARONLINE64 - Under Construction</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:radial-gradient(circle at top,#133a7a 0%,#0b1730 20%,#050505 60%,#000 100%);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
    overflow:hidden;
}

.container{
    max-width:700px;
    padding:40px;
}

h1{
    font-size:4rem;
    letter-spacing:4px;
    margin-bottom:20px;
    text-shadow:0 0 10px #fff,
                0 0 20px #fff,
                0 0 35px #00bfff;
}

h2{
    font-size:1.6rem;
    margin-bottom:35px;
    color:#9fdfff;
    letter-spacing:2px;
}

p{
    font-size:1.2rem;
    line-height:1.8;
    color:#ddd;
}

.gear{
    font-size:90px;
    animation:spin 8s linear infinite;
    margin-bottom:25px;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

footer{
    margin-top:50px;
    font-size:0.95rem;
    color:#999;
}
</style>
</head>

<body>

<div class="container">

<div class="gear">⚙️</div>

<h1>UNDER CONSTRUCTION</h1>

<h2>KARONLINE64</h2>

<p>
Our karaoke song catalog is currently being updated.
</p>

<p style="margin-top:15px;">
We'll be back very soon with new features and an improved experience.
</p>

<footer>
Thank you for your patience.
</footer>

</div>

</body>
</html>
