<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Floribar Karaoke</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<img src="logo.png" id="logo" alt="Floribar">

<h1>KARAOKE</h1>

<input
type="text"
id="search"
placeholder="Search artist or song..."
autocomplete="off">

</header>

<main>

<div id="welcome">

    <div id="welcomeSearch" class="welcomeAction">
        <span class="icon">🎤</span>
        <span>Pick your song and let's sing!</span>
    </div>

    <div id="welcomeCatalog" class="welcomeAction">
        <span class="icon">📚</span>
        <span>View our entire catalog</span>
    </div>

</div>

<div id="songs"></div>

<div id="catalog" class="hidden">

</div>

</main>

<nav>

<button id="homeBtn">
🏠 Home
</button>

<button id="catalogBtn">
📚 Catalog
</button>

<button id="favBtn">
⭐ My Songs
</button>

</nav>

<script src="script.js"></script>

</body>

</html>
